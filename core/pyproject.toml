# al-core — AgentLighthouse data + control plane (MIT).
[project]
name = "al-core"
version = "0.2.0"
description = "AgentLighthouse core: proxies, scanners, policy engine, receipts, CLI"
authors = [{ name = "Amit Kala" }]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "al-verify",
    "cryptography>=43",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "typer>=0.12",
    "watchfiles>=0.22",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/neural-nomad1709/agentlighthouse"
Repository = "https://github.com/neural-nomad1709/agentlighthouse"

[project.optional-dependencies]
scanners = ["detect-secrets>=1.5"]
# The concurrent-writer mirror (two mediators sharing one query surface).
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
al = "al_core.cli.main:app"

[tool.uv.sources]
al-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["al_core"]
