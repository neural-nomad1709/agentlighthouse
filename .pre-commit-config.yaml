# Supply-chain hygiene: scan our OWN repo for committed secrets (invariant #5).
# A signing key that leaks into history means forgeable evidence — so this runs
# before every commit and blocks key material / high-entropy strings.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(uv\.lock|.*\.lock)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      # Belt-and-suspenders: refuse private keys outright.
      - id: detect-private-key
